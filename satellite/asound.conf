# Claude Home: the USB headset/speaker (card 2) is the default device for every user,
# including the raspotify service (which runs as its own user).
defaults.pcm.card 2
defaults.ctl.card 2

# Playback shares one mixer (ALSA's built-in dmix) so the voice, chimes, and music can play at once.
# Its shared semaphore is created by whichever user opens the device first, owner-only by default;
# when raspotify got there first, the satellite failed with "unable to create IPC semaphore:
# Permission denied". Open permissions let every user share it. (A hand-written dmix definition
# fixed that too, but PortAudio couldn't open streams on it: "Invalid argument".)
defaults.pcm.ipc_perm 0666

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on card 2, so the satellite can duck music while it listens or speaks
# (amixer -c 2 sset Music 20%). It sits on top of "default", so it mixes with the voice.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card 2
    }
}
