# Claude Home: for every user, including the raspotify service (which runs as its own user), sound plays
# and the mic listens on a ReSpeaker XVF3800 array (the card named "Array"). Every device below names its
# card, as the card numbers change between boots. The volume controls live on the loopback card (the
# satellite's MIXER_CARD), which is always there whatever is plugged in.

# Everything is mixed onto the array's own output (its 3.5 mm jack) at 48 kHz, the only rate its 48k2ch
# firmware takes (Seeed's v2.1.1_48k2ch USB build; the stock firmware takes only 16 kHz, which cuts music off
# above 8 kHz). Playing through the array is what lets it cancel that sound from the mic, so the wake word
# is heard over music. (bt-speaker.sh is the other way: mix onto ALSA's loopback card, "dmix:CARD=Loopback,
# DEV=0,FORMAT=S16_LE,RATE=48000,CHANNELS=2", and carry it to a Bluetooth speaker, with no echo cancelling.
# The Pi's own 3.5 mm jack can't take dmix at all: it opens but never plays.) dmix and the mic's dsnoop share a
# semaphore created by whichever user opens them first, owner-only by default, so open permissions let
# every user share them (raspotify getting there first once failed the satellite with "unable to create
# IPC semaphore: Permission denied").
defaults.pcm.ipc_perm 0666

# "default": playback goes through a software volume control named "Master", the speaker's volume
# for everything (the screen's volume slider sets it). It is software so it works the same whatever
# is plugged in: USB devices' own controls vary, and some ignore them. Capture is the mic, shared.
# max_dB -6 is headroom: every stream comes out at least 6 dB down, so two at once (the voice over music)
# can't add up past full scale in the mix, which clips them into static.
pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}
pcm.speaker {
    type plug
    slave.pcm "speakervol"
}
pcm.speakervol {
    type softvol
    slave.pcm "dmix:CARD=Array,DEV=0,FORMAT=S16_LE,RATE=48000,CHANNELS=2"
    max_dB -6.0
    control {
        name "Master"
        card Loopback
    }
}
# The array sends 2 channels at 48 kHz. The left is its call output, which turns itself down about 9 dB
# whenever anything plays (even with the speaker off), so the wake word struggled over music. The right is
# its ASR output: the same echo-cancelled beam without that processing, made for speech recognition. The
# mono mic is the right channel alone; plug resamples it to the satellite's 16 kHz. The ASR gain is set on
# the array (AEC_ASROUTGAIN 2, saved to its flash; see docs/pi.md, step 4).
pcm.mic {
    type plug
    slave.pcm "dsnoop:CARD=Array"
    ttable.0.1 1
}

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on the loopback card, so the satellite can duck music while it listens or speaks
# (amixer -c Loopback sset Music 20%). It sits on top of "default", so it mixes with the voice and
# follows Master.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card Loopback
    }
}
