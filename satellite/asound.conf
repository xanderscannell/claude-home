# Claude Home: speakers on the Pi's 3.5 mm jack (card "Headphones") and a USB mic (card "Audio") are the
# default devices for every user, including the raspotify service (which runs as its own user). Cards are
# named, not numbered: USB cards can enumerate in a different order. (defaults.pcm.card and
# defaults.ctl.card only take numbers, so "default" below and this ctl.!default set the devices instead.)
ctl.!default {
    type hw
    card Headphones
}

# Playback shares one mixer (ALSA's built-in dmix) so the voice, chimes, and music can play at once.
# Its shared semaphore is created by whichever user opens the device first, owner-only by default;
# when raspotify got there first, the satellite failed with "unable to create IPC semaphore:
# Permission denied". Open permissions let every user share it. (A hand-written dmix definition
# fixed that too, but PortAudio couldn't open streams on it: "Invalid argument".)
defaults.pcm.ipc_perm 0666

# "default": playback goes through a software volume control named "Master", the speaker's volume
# for everything (the screen's volume slider sets it). It is software so it works the same whatever
# is plugged in: USB devices' own controls vary, and some ignore them. Capture is the mic, shared.
pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}
pcm.speaker {
    type plug
    slave.pcm "speakervol"
}
pcm.speakervol {
    type softvol
    slave.pcm "dmix:Headphones"
    control {
        name "Master"
        card Headphones
    }
}
pcm.mic {
    type plug
    slave.pcm "dsnoop:Audio"
}

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on the speakers' card, so the satellite can duck music while it listens or speaks
# (amixer -c Headphones sset Music 20%). It sits on top of "default", so it mixes with the voice and
# follows Master.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card Headphones
    }
}
