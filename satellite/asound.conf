# Claude Home: for every user, including the raspotify service (which runs as its own user), sound plays
# on a Bluetooth speaker and the mic is a ReSpeaker XVF3800 array (the card named "Array").
# Every device below names its card, as the card numbers change between boots. The volume controls live on
# the loopback card (the satellite's MIXER_CARD), which is always there whatever is plugged in.

# A Bluetooth speaker (bluez-alsa) takes one stream at a time, and dmix only mixes onto a real card, so
# everything is mixed onto ALSA's loopback card (snd-aloop, named "Loopback") and bt-speaker.sh carries
# the mix from the loopback's other side to the speaker. dmix's format is fixed so that side can match it.
# (The Pi's own 3.5 mm jack, card 0, is the opposite: dmix on it opens but never plays, and its driver mixes
# 8 streams itself, so it would be opened directly with "hw:0,0".) dmix and the mic's dsnoop share a
# semaphore created by whichever user opens them first, owner-only by default, so open permissions let
# every user share them (raspotify getting there first once failed the satellite with "unable to create
# IPC semaphore: Permission denied").
defaults.pcm.ipc_perm 0666

# "default": playback goes through a software volume control named "Master", the speaker's volume
# for everything (the screen's volume slider sets it). It is software so it works the same whatever
# is plugged in: USB devices' own controls vary, and some ignore them. Capture is the mic, shared.
# max_dB -6 is headroom: every stream comes out at least 6 dB down, so two at once (the voice over music)
# can't add up past full scale in the mix, which clips them into static.
pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}
pcm.speaker {
    type plug
    slave.pcm "speakervol"
}
pcm.speakervol {
    type softvol
    slave.pcm "dmix:CARD=Loopback,DEV=0,FORMAT=S16_LE,RATE=48000,CHANNELS=2"
    max_dB -6.0
    control {
        name "Master"
        card Loopback
    }
}
# The array's stock firmware sends 2 channels at 16 kHz; the left is its processed beam, the one to listen
# to (the right is much quieter), so the mono mic is the left channel alone rather than a mix of both.
pcm.mic {
    type plug
    slave.pcm "dsnoop:CARD=Array"
    ttable.0.0 1
}

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on the loopback card, so the satellite can duck music while it listens or speaks
# (amixer -c Loopback sset Music 20%). It sits on top of "default", so it mixes with the voice and
# follows Master.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card Loopback
    }
}
