# Claude Home: for every user, including the raspotify service (which runs as its own user), sound plays
# through the Pi's 3.5 mm jack (card 0, powered speakers) and the mic is the USB headset's (card 2).
# The volume controls stay on card 2 (the satellite's MIXER_CARD); a softvol control can live on any card.
defaults.pcm.card 2
defaults.ctl.card 2

# The jack needs no software mixer: its driver has 8 hardware streams and mixes them, so the voice, chimes,
# and music each open it directly and play at once. (ALSA's dmix on it opens but never plays: the
# hardware position stays at 0 and writes block.) The mic is shared through dsnoop, whose shared
# semaphore is created by whichever user opens it first, owner-only by default, so open permissions
# let every user share it (raspotify getting there first once failed the satellite with "unable to
# create IPC semaphore: Permission denied").
defaults.pcm.ipc_perm 0666

# "default": playback goes through a software volume control named "Master", the speaker's volume
# for everything (the screen's volume slider sets it). It is software so it works the same whatever
# is plugged in: USB devices' own controls vary, and some ignore them. Capture is the mic, shared.
# max_dB -6 is headroom: every stream comes out at least 6 dB down, so two at once (the voice over music)
# can't add up past full scale in the mix, which clips them into static.
pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "mic"
}
pcm.speaker {
    type plug
    slave.pcm "speakervol"
}
pcm.speakervol {
    type softvol
    slave.pcm "hw:0,0"
    max_dB -6.0
    control {
        name "Master"
        card 2
    }
}
pcm.mic {
    type plug
    slave.pcm "dsnoop:2"
}

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on card 2, so the satellite can duck music while it listens or speaks
# (amixer -c 2 sset Music 20%). It sits on top of "default", so it mixes with the voice and
# follows Master.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card 2
    }
}
