# Claude Home: the USB headset/speaker (card 2) is the default device for every user,
# including the raspotify service.
defaults.pcm.card 2
defaults.ctl.card 2

# "music": music players (raspotify) play through this. It is a software volume control named
# "Music" on card 2, so the satellite can duck music while it listens or speaks
# (amixer -c 2 sset Music 20%). It sits on top of "default", which mixes (dmix) with the voice.
pcm.music {
    type plug
    slave.pcm "musicvol"
}
pcm.musicvol {
    type softvol
    slave.pcm "default"
    control {
        name "Music"
        card 2
    }
}
