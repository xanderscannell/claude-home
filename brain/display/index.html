<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Home</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="dashboard" class="dashboard">
  <div class="backdrop" aria-hidden="true"></div>
  <div id="photo-a" class="photo" aria-hidden="true"></div>
  <div id="photo-b" class="photo" aria-hidden="true"></div>
  <!-- The dashboard drawn as a sheet while it's swiped: under the clock and the rest (which fade out over it), the
       photo shrinks into a sheet's frame, and the sheet's background and title come up around it -->
  <section id="sheet-dash" class="dash" hidden aria-hidden="true">
    <div class="dash-bg"></div>
    <h2 class="sheet-title">Dashboard</h2>
    <div class="sheet-body"><div id="dash-photo" class="dash-photo"><div id="dash-pic" class="dash-pic"></div></div></div>
  </section>
  <div class="scrim" aria-hidden="true"></div>

  <main id="home" class="home">
    <button id="menu" class="menu" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
    </button>
    <section id="weather" class="weather" aria-live="polite"></section>
    <div class="clock">
      <time id="time" class="time"></time>
      <div id="date" class="date"></div>
    </div>
    <div id="strip" class="strip"></div>
    <button id="mic" class="mic" type="button" aria-label="Talk to Claude">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </main>
  </div>

  <section id="night" class="night" aria-label="Night clock">
    <time id="night-time" class="night-time"></time>
  </section>

  <section id="sheet-under" class="sheet under" hidden aria-hidden="true">
    <span class="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>  <!-- looks only -->
    <h2 id="under-title" class="sheet-title"></h2>
    <div id="under-body" class="sheet-body"></div>
  </section>
  <div id="swipe-dim" class="swipe-dim" hidden aria-hidden="true"></div>

  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button id="sheet-edge" class="edge" type="button" aria-label="Back" hidden></button>
    <h2 id="sheet-title" class="sheet-title"></h2>
    <button id="sheet-close" class="close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <section id="overlay" class="overlay" data-state="idle" hidden aria-live="polite">
    <button id="close-overlay" class="close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p id="heard" class="heard"></p>
    <div id="reply" class="reply"></div>
    <div class="light" aria-hidden="true"><i></i></div>
    <button id="stop" class="stop" type="button">Stop</button>
  </section>

  <section id="camera" class="camera" hidden role="dialog" aria-modal="true" aria-labelledby="camera-name">
    <video id="camera-video" autoplay muted playsinline></video>
    <h2 id="camera-name" class="camera-name"></h2>
    <p id="camera-note" class="camera-note"></p>
    <button id="camera-close" class="close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </section>

  <section id="ringing" class="ringing" hidden role="alertdialog" aria-labelledby="ringing-time">
    <div class="ringing-pulse" aria-hidden="true"></div>
    <p id="ringing-time" class="ringing-time"></p>
    <p id="ringing-label" class="ringing-label"></p>
    <div class="ringing-actions">
      <button id="snooze" class="snooze" type="button">Snooze</button>
      <button id="ringing-stop" class="ringing-stop" type="button">Stop</button>
    </div>
  </section>

  <div id="offline" class="offline" role="status" hidden>Can't reach Claude Home. Trying again…</div>
</body>
</html>
